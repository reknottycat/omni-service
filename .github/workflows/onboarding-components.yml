name: Clean Linux onboarding components
on:
  pull_request:
    paths:
      - "deploy/**"
      - "scripts/*onboarding*"
      - "scripts/setup-personal.sh"
      - "scripts/install-personal.sh"
      - "scripts/install-dgx.sh"
      - "requirements-onboarding.lock"
      - "requirements-onboarding.txt"
      - "src/omni_service/onboarding*.py"
      - "src/omni_service/telegram_tdlib.py"
      - "tests/test_*dependencies.py"
      - "tests/test_setup_personal.py"
      - "tests/test_dependency_bundle.py"
      - "tests/test_onboarding_tools.py"
      - "tests/test_personal_install.py"
      - ".github/workflows/onboarding-components.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: omni-onboarding-components-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux-native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            architecture: amd64
          - runner: ubuntu-24.04-arm
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Build minimal Ubuntu dependency image
        run: |
          docker build --file deploy/clean-install.Dockerfile --target build --tag omni-clean-build .
          docker build --file deploy/clean-install.Dockerfile --target runtime --tag omni-clean-runtime .
          mkdir -p "$RUNNER_TEMP/omni-clean"
          sudo chown 10001:10001 "$RUNNER_TEMP/omni-clean"
      - name: Fresh native installation and dependency bundle
        run: |
          docker run --rm --cap-drop=ALL --security-opt=no-new-privileges \
            --mount "type=bind,src=$PWD,dst=/repo,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/omni-clean,dst=/work" \
            omni-clean-build online /work
      - name: Fresh offline installation, repeat and corruption rejection
        run: |
          docker run --rm --network=none --cap-drop=ALL --security-opt=no-new-privileges \
            --mount "type=bind,src=$PWD,dst=/repo,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/omni-clean,dst=/work" \
            omni-clean-runtime offline /work
      - name: Show recorded scope and dependency versions
        if: always()
        run: |
          sudo find "$RUNNER_TEMP/omni-clean" -maxdepth 1 -name 'clean-install-*.json' \
            -exec cat '{}' \;
          mkdir -p "$RUNNER_TEMP/omni-deliverables"
          sudo find "$RUNNER_TEMP/omni-clean" -maxdepth 1 -type f \
            \( -name 'clean-install-*.json' -o -name 'onboarding-linux.tar.gz*' \) \
            -exec install -m 0644 --target-directory="$RUNNER_TEMP/omni-deliverables" '{}' +
      - name: Archive dependency bundle and scoped test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: omni-onboarding-linux-${{ matrix.architecture }}-${{ github.sha }}
          path: ${{ runner.temp }}/omni-deliverables/
          if-no-files-found: warn
          retention-days: 14
