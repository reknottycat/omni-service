name: Native onboarding components
on:
  pull_request:
    paths:
      - "deploy/setup_personal.py"
      - "deploy/install_personal.py"
      - "scripts/setup-personal.sh"
      - "requirements-onboarding.lock"
      - "src/omni_service/onboarding*.py"
      - "src/omni_service/telegram_tdlib.py"
      - ".github/workflows/onboarding-components.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: omni-onboarding-components-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Prepare build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y gperf libssl-dev zlib1g-dev
      - name: Build pinned native dependency and prepare official SDK
        env:
          CC: clang
          CXX: clang++
        run: |
          export XDG_CONFIG_HOME="$RUNNER_TEMP/omni-config"
          export XDG_DATA_HOME="$RUNNER_TEMP/omni-data"
          bash scripts/setup-personal.sh acceptance prepare
          bash scripts/setup-personal.sh acceptance prepare
          python3.12 - <<'PY'
          import json, os
          from pathlib import Path
          config = Path(os.environ["XDG_CONFIG_HOME"]) / "omni-service" / "acceptance"
          assert json.loads((config / "personal.json").read_text())["mode"] == "disabled"
          assert not list(Path(os.environ["XDG_DATA_HOME"]).rglob("*.sqlite3"))
          PY
