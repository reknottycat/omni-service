name: 任务块与验收追踪
description: 记录价值贡献、交付物、依赖、验收命令、证据和阻塞；已有任务优先更新原 Issue。
title: "[Task] "
body:
  - type: markdown
    attributes:
      value: |
        当前 P0 的完成标准为 Linux 模拟数据验收通过。真实账号、生产环境和后续能力不自动成为 P0 门禁。
        创建前先检查已有总控与任务，避免重复跟踪。完成项须附可核对证据。
  - type: input
    id: parent
    attributes:
      label: 父目标与任务 ID
      description: 总控 Issue、阶段名、docs/progress.md 中的 T-ID 或后续 B-ID。
      placeholder: "P0 / T-03 / #1"
    validations:
      required: true
  - type: textarea
    id: value
    attributes:
      label: 目标贡献与可观察结果
      description: 说明本块完成后用户可以做什么，以及为什么需要它。
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 交付物与修改范围
      description: 文件、接口、数据结构、必须保持的行为和明确不在本块的内容。
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: 依赖与负责人
      description: 前置任务、可并行部分、共享文件的单一写入人；没有依赖写“无”。
    validations:
      required: true
  - type: dropdown
    id: status
    attributes:
      label: 当前状态
      options:
        - todo
        - in_progress
        - verify
        - blocked
        - done
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 验收命令与通过条件
      description: 关联 AC ID，写具体输入、运行命令和可以观察到的成功/失败边界。
      value: |
        - AC ID：
        - 命令：bash scripts/acceptance.sh
        - 场景与输入：
        - 通过条件：
        - 模拟/真实范围：
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 证据与结果
      description: 未运行写“未运行”，不得用计划、编译成功或自述代替验证。
      value: |
        - 被测提交/工作树：
        - Linux/Python 环境：
        - 实际结果与退出码：未运行
        - 报告/日志/PR/CI 链接：
  - type: textarea
    id: blocker
    attributes:
      label: 阻塞与解除条件
      description: 只登记真实阻塞；无阻塞写“无”。
      value: |
        - 负责人：
        - 原因与复现：
        - 证据：
        - 解除条件：
        - 不受影响的下一步：
  - type: checkboxes
    id: closure
    attributes:
      label: 收口核对
      options:
        - label: 已核对已有任务，没有重复追踪。
        - label: 所有必选验收有绑定版本的实际证据。
        - label: 进度和决策日志已同步，后续范围已登记。
        - label: Linux 模拟、CI、PR 合并与真实接入状态已分别记录。
