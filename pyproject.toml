[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "omni-service"
version = "0.2.0"
description = "Personal-account customer service bridge with Feishu and local models"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
live = ["lark-oapi==1.9.0"]

[project.scripts]
omni-service = "omni_service.runtime:main"

[tool.setuptools.packages.find]
where = ["src"]
